<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D9E75" />
    <title>NutraLance — Hors ligne</title>
    <style>
      :root {
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #64748b;
        --primary: #1d9e75;
        --card: #ffffff;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #f1f5f9;
          --muted: #94a3b8;
          --card: #1e293b;
          --border: #334155;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
      p { font-size: 14px; color: var(--muted); margin: 0 0 8px; line-height: 1.5; }
      .alt { font-size: 13px; }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        background: var(--primary);
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="logo" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="180" height="180" rx="37" fill="#1d9e75" />
        <g transform="translate(90,90) scale(0.95) translate(-90,-90)">
          <path
            fill="#ffffff"
            d="M101.141 53H136.632C151.023 53 162.689 64.6662 162.689 79.0573V112.904H148.112V79.0573C148.112 78.7105 148.098 78.3662 148.072 78.0251L112.581 112.898C112.701 112.902 112.821 112.904 112.941 112.904H148.112V126.672H112.941C98.5504 126.672 86.5638 114.891 86.5638 100.5V66.7434H101.141V100.5C101.141 101.15 101.191 101.792 101.289 102.422L137.56 66.7816C137.255 66.7563 136.945 66.7434 136.632 66.7434H101.141V53Z"
          />
          <path
            fill="#ffffff"
            d="M65.2926 124.136L14 66.7372H34.6355L64.7495 100.436V66.7372H80.1365V118.47C80.1365 126.278 70.4953 129.958 65.2926 124.136Z"
          />
        </g>
      </svg>
      <h1>Vous êtes hors ligne</h1>
      <p>Vérifiez votre connexion internet, puis réessayez.</p>
      <p class="alt" dir="rtl" lang="ar">&#1571;&#1606;&#1578; &#1594;&#1610;&#1585; &#1605;&#1578;&#1589;&#1604; &#1576;&#1575;&#1604;&#1573;&#1606;&#1578;&#1585;&#1606;&#1578;. &#1578;&#1581;&#1602;&#1602; &#1605;&#1606; &#1575;&#1604;&#1575;&#1578;&#1589;&#1575;&#1604; &#1579;&#1605; &#1571;&#1593;&#1583; &#1575;&#1604;&#1605;&#1581;&#1575;&#1608;&#1604;&#1577;.</p>
      <p class="alt" lang="en">You are offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
